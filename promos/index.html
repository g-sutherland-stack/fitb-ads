<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FitB promos</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#1b2217;color:#eee;font:15px/1.4 system-ui,sans-serif;padding:20px}
h1{font-size:22px;margin:0 0 6px} h2{font-size:17px;margin:28px 0 8px;color:#d9b64a}
p{color:#bbb;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
figure{margin:0;background:#26301f;border-radius:10px;padding:8px} video{width:100%;border-radius:6px;background:#000}
figcaption{font-size:13px;color:#ccc;padding:6px 2px 0}
.sheet{width:100%;border-radius:8px;margin:6px 0 14px}
</style></head><body>
<h1>FitB promos, 24 s, 1920×1080</h1>
<p>Five styles, one per reference video, five themes each. Each video has its own layout and screens. Sound is on when you press play. Contact sheet per style: rows are themes, columns are 3 s · 8 s · 15 s · 21 s.</p>
<script>
const styles=[['pixel','Style A · from weight_loss_guesswork_original_landscape.mp4 (portrait page on blurred sides, stacked giant letters, product card, phone zoom)'],
['plans','Style B · from plans_built_around_your_goal_original_landscape.mp4 (landscape pixel page, giant word crossing, card, caption + photo card)'],
['dark','Style C · from weight_loss_guesswork_landscape.mp4 (dark green, centred headline, gold FREE pill, receipt card, FitB lockup)'],
['blobs','Style D · from weight_loss_guesswork_original_2_landscape.mp4 (olive starburst, serif headline, mustard blob, cream close)'],
['kinetic','Style E · from weight_loss_guesswork_alt_landscape.mp4 (words land one by one, gold underline, photo card)']];
const themes=['tracking','trainers','gym','recovery','weight-loss'];
for(const [k,label] of styles){
  document.write(`<h2>${label}</h2><img class="sheet" src="${k}/contact-sheet.jpg" alt=""><div class="grid">`);
  for(const t of themes) document.write(`<figure><video controls preload="metadata" src="${k}/fitb-${k}-${t}-24s.mp4"></video><figcaption>${k} · ${t}</figcaption></figure>`);
  document.write('</div>');
}
</script>
</body></html>
